<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Kamu</title>
  <style>
    /* Mengatur tampilan agar posisi konten di tengah layar */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #232121;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;

    /* Judul Utama Warna Hitam */
    h1 {
      color: #000000;
      font-size: 24px;
      margin-bottom: 5px;
    }

    /* Ikon Love Warna Pink */
    .heart {
      color: #ff69b4;
      font-size: 40px;
      margin: 10px 0;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* Tombol: Latar Hitam, Tulisan Putih */
    .btn {
      background-color: #000000;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: opacity 0.3s;
      margin-top: 15px;
    }

    .btn:hover {
      opacity: 0.8;
    }

    /* Kontainer Foto Awalnya Tersembunyi */
    .photo-box {
      display: none;
      animation: fadeIn 0.8s forwards;
    }

    .photo-box img {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Bagian Awal (Teks, Love, dan Tombol) -->
    <div id="contentAwal">
      <h1>Untuk Kamu</h1>
      <div class="heart">❤️</div>
      <button class="btn" onclick="tampilkanFoto()">Klik di Sini</button>
    </div>

    <!-- Bagian Foto Murni (Tanpa Teks Apapun) -->
    <div class="photo-box" id="myPhoto">
      <!-- Ganti fotoku.jpg sesuai nama file foto kamu di GitHub -->
      <img src="Foto.jpg" alt="Foto Spesial">
    </div>
  </div>

  <script>
    function tampilkanFoto() {
      // Sembunyikan bagian tulisan awal & tombol
      document.getElementById("contentAwal").style.display = "none";
      // Tampilkan fotonya saja
      document.getElementById("myPhoto").style.display = "block";
    }
  </script>

</body>
</html>
